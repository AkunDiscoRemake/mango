name: Build RobloxVR APK

on:
  push:
    branches: [ "arena/01a0c08b-mango", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: ./RobloxVR
        run: |
          gradle assembleDebug --no-daemon --info > /tmp/raw_gradle.txt 2>&1 || true
          cat /tmp/raw_gradle.txt | grep -E "(error:|FAILURE|What went wrong|Caused by|compileDebugKotlin)" -A 10 | head -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          cat /tmp/raw_gradle.txt | grep -E "(\.kt:[0-9]+|\.java:[0-9]+)" | head -n 20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1
