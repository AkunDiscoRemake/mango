name: Build RobloxVR APK

on:
  push:
    branches: [ "arena/01a0c08b-mango", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: ./RobloxVR
        run: |
          gradle assembleDebug --no-daemon > /tmp/out.txt 2>&1 || true
          grep -A 20 -E "(\* What went wrong|FAILURE: Build failed)" /tmp/out.txt | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1
