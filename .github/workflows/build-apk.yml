name: Build RobloxVR APK

on:
  push:
    branches: [ "arena/01a0c08b-mango", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        working-directory: ./RobloxVR
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          CODE=$?
          cat /tmp/build.log
          exit $CODE

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RobloxVR-apk
          path: |
            RobloxVR/app/build/outputs/apk/debug/*.apk
            /tmp/build.log
